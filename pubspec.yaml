name: flutter_hongguo
description: Hongguo Flutter client and independently testable shared Dart core.
publish_to: none
version: 0.2.3+5
environment:
  sdk: '>=3.13.0 <4.0.0'
workspace:
  - packages/core
  - packages/api
  - packages/app
# As in hack-news-flutter: members use any; dependency policy lives here.
dependency_overrides:
  flutter_riverpod: 3.4.3
  get_it: 8.3.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  flutter_secure_storage: 11.2.0
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  dio: 5.11.1
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  test: ^1.31.0
  lints: ^6.1.0
dev_dependencies:
  hongguo_core: any
