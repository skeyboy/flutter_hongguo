name: Publish selected installer attachments
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms JSON array; others are not rebuilt'
        type: string
        default: '["android","android-tv","macos","windows","linux"]'
        required: true
      ios:
        description: 'Build signed iOS IPA (requires Apple signing secrets)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reject unusable signing or version requests before building
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_IOS: ${{ inputs.ios }}
          IOS_ENABLED: ${{ vars.IOS_SIGNING_ENABLED }}
        run: |
          if [[ "$REQUEST_IOS" == true && "$IOS_ENABLED" != true ]]; then
            echo 'Configure Apple signing secrets and IOS_SIGNING_ENABLED before requesting an IPA.' >&2
            exit 1
          fi
          tag="v$(python3 tool/ci/release_meta.py version)"
          if ! existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null); then
            existing=""
          fi
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo 'Increment pubspec: this version already points to a different commit.' >&2
            exit 1
          fi
  build:
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      release-build: true
      platforms: ${{ inputs.platforms || '["android","android-tv","macos","windows","linux"]' }}
    secrets: inherit
  ios-signed:
    needs: build
    if: inputs.ios == true && vars.IOS_SIGNING_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - name: Restore distribution identity and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}
        run: python3 tool/ci/setup_ios_signing.py
      - name: Build signed device-installable IPA
        working-directory: packages/app
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - name: Package IPA
        run: |
          mkdir -p dist
          version=$(python3 tool/ci/release_meta.py version)
          cp packages/app/build/ios/ipa/*.ipa "dist/Hongguo-$version-ios-arm64.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-ios-signed
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hongguo-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist"
  publish:
    needs: [build, ios-signed]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.ios-signed.result == 'success' || needs.ios-signed.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve release version
        id: version
        run: echo "tag=v$(python3 tool/ci/release_meta.py version)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify required installers and describe iOS status
        env:
          IOS_SIGNED: ${{ needs.ios-signed.result == 'success' }}
          RELEASE_PLATFORMS: ${{ inputs.platforms || '["android","android-tv","macos","windows","linux"]' }}
        run: python3 tool/ci/validate_release.py
      - name: Generate checksums and release manifest
        run: python3 tool/ci/release_meta.py checksums dist
      - name: Verify Windows release attachments
        if: contains(fromJSON(inputs.platforms || '["android","android-tv","macos","windows","linux"]'), 'windows')
        run: |
          version=$(python3 tool/ci/release_meta.py version)
          test -s "dist/Hongguo-$version-windows-x64.zip"
          test -s "dist/Hongguo-$version-windows-x64-setup.exe"
      - name: Publish completed assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            existing=""
          fi
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo 'Version already belongs to a different commit. Increment pubspec before publishing.' >&2
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Hongguo $RELEASE_TAG" --notes-file build/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file build/release-notes.md
