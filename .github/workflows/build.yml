name: Build selected installer attachments
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms JSON array; build only what you need'
        type: string
        default: '["android"]'
        required: true
  workflow_call:
    inputs:
      platforms:
        type: string
        default: '["android","android-tv","macos","windows","linux"]'
      release-build:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate selected platforms before starting paid builders
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: python3 tool/ci/plan_build.py
      - run: python3 tool/ci/release_meta.py version
      - run: python3 -m unittest discover -s tool/ci/tests -v
  verify:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - name: Analyze Flutter application
        working-directory: packages/app
        run: flutter analyze
      - name: Analyze the Android TV interaction module
        working-directory: packages/tv
        run: flutter analyze
      - name: Verify D-pad focus and television remote behaviour
        working-directory: packages/tv
        run: flutter test --reporter expanded
      - name: Verify shared Dart core
        working-directory: packages/core
        run: dart test --reporter expanded
      - name: Verify API and media pipeline
        working-directory: packages/api
        run: dart test --reporter expanded
      - name: Verify the DLNA casting protocol core
        working-directory: packages/cast
        run: dart test --reporter expanded
      - name: Verify application and adaptive interactions
        working-directory: packages/app
        run: flutter test --reporter expanded
      - name: Verify television settings under the TV build flag
        working-directory: packages/app
        run: flutter test test/tv_settings_test.dart --dart-define=HONGGUO_TV=true --reporter expanded
  native:
    needs: [plan, verify]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: (matrix.platform == 'android' || matrix.platform == 'android-tv')
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libmpv-dev
      - name: Configure stable Android release signing
        if: (matrix.platform == 'android' || matrix.platform == 'android-tv') && inputs.release-build == true
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tool/ci/restore_android_signing.py
      - name: Build Android APKs
        if: (matrix.platform == 'android' || matrix.platform == 'android-tv')
        working-directory: packages/app
        run: flutter build apk --release --split-per-abi --flavor ${{ matrix.platform == 'android-tv' && 'tv' || 'mobile' }}
      - name: Package Android and verify signatures
        if: (matrix.platform == 'android' || matrix.platform == 'android-tv')
        env:
          ANDROID_FLAVOR: ${{ matrix.platform == 'android-tv' && 'tv' || 'mobile' }}
        run: python3 tool/ci/package_android.py
      - name: Select an Xcode that ships the macOS 26 SDK
        if: matrix.platform == 'macos'
        run: |
          xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo 'connectivity_plus 7.3.2 compiles NWPathMonitor.isUltraConstrained, which only exists in the macOS 26 SDK; this runner has no Xcode 26.' >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          "$xcode/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Build macOS
        if: matrix.platform == 'macos'
        env:
          FLUTTER_MACOS_ARM64_ONLY: 'true'
        working-directory: packages/app
        run: flutter build macos --release --target lib/main.dart
      - name: Build Windows
        if: matrix.platform == 'windows'
        working-directory: packages/app
        run: flutter build windows --release
      - name: Build Linux
        if: matrix.platform == 'linux'
        working-directory: packages/app
        run: flutter build linux --release
      - name: Package desktop installers
        if: contains(fromJSON('["macos","windows","linux"]'), matrix.platform)
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tool/ci/package_desktop.py '${{ matrix.platform }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
