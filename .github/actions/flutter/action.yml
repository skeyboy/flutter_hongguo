name: Flutter workspace
description: Install the workspace SDK and resolve locked dependencies.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.47.4' # Keep in sync with .fvmrc.
        channel: stable
        cache: true
    - shell: bash
      run: flutter pub get --enforce-lockfile
